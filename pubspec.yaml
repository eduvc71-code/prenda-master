name: prenda_master
description: Aplicación Flutter para control de préstamos con prendas.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.13.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Estado
  flutter_riverpod: ^2.5.1

  # Base de datos
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.3
  path: ^1.9.0

  # Rutas
  go_router: ^14.2.0

  # Cámara / imágenes
  camera: ^0.10.5
  image_picker: ^1.1.1
  image_cropper: ^8.1.0

  # OCR
  google_mlkit_text_recognition: ^0.13.0

  # Google APIs / Backup
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  http: ^1.2.0

  # Compresión y cifrado
  archive: ^3.6.1
  encrypt: ^5.0.3

  # Tareas programadas / Notificaciones
  workmanager: ^0.10.7
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.4

  # Reportes
  pdf: ^3.10.8
  printing: ^5.12.0
  excel: ^4.0.4
  fl_chart: ^0.68.0

  # Seguridad
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.2.0
  crypto: ^3.0.3

  # Permisos
  permission_handler: ^11.3.1

  # Utilidades
  logger: ^2.3.0
  intl: ^0.19.0
  uuid: ^4.4.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  drift_dev: ^2.18.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/